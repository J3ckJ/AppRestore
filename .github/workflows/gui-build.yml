name: GUI build

on:
  push:
    branches: [gui]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    name: Windows GUI artifact
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        shell: pwsh
        run: |
          python -m pip install -U pip
          python -m pip install .[gui] pyinstaller
      - name: Test
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          python -m pip install pytest pytest-qt
          python -m pytest -q tests/test_gui_icons.py tests/test_gui_adapter.py tests/test_gui_smoke.py tests/test_frozen_runtime.py
      - name: Build
        shell: pwsh
        run: |
          pyinstaller packaging/apprestore-gui.spec --noconfirm --clean
      - name: Bundle pinned ipatool
        shell: pwsh
        run: |
          python packaging/fetch_ipatool.py --dest dist/AppRestore
      - name: Smoke test the built exe (--self-test)
        shell: pwsh
        run: |
          $report = Join-Path $PWD "selftest-windows.json"
          $proc = Start-Process -FilePath "dist\AppRestore\AppRestore.exe" `
            -ArgumentList @("--self-test", "--output", "`"$report`"") `
            -Wait -PassThru -NoNewWindow
          if (Test-Path $report) { Get-Content $report -Raw } else { Write-Host "no report written" }
          Write-Host "self-test exit code: $($proc.ExitCode)"
          if ($proc.ExitCode -ne 0) { exit 1 }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: selftest-windows
          path: selftest-windows.json
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        with:
          name: AppRestore-windows
          path: dist/AppRestore/**

  macos:
    name: macOS GUI artifact
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install -U pip
          python -m pip install '.[gui]' pyinstaller
      - name: Test
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          python -m pip install pytest pytest-qt
          python -m pytest -q tests/test_gui_icons.py tests/test_gui_adapter.py tests/test_gui_smoke.py tests/test_frozen_runtime.py
      - name: Build
        run: |
          pyinstaller packaging/apprestore-gui.spec --noconfirm --clean
      - name: Bundle pinned ipatool
        run: |
          python packaging/fetch_ipatool.py --dest dist/AppRestore.app/Contents/MacOS
          # Adding a file invalidates PyInstaller's ad-hoc signature; re-sign ad-hoc.
          codesign --force --deep --sign - dist/AppRestore.app
      - name: Smoke test the built app (--self-test)
        run: |
          set +e
          dist/AppRestore.app/Contents/MacOS/AppRestore --self-test --output "$PWD/selftest-macos.json"
          code=$?
          echo "self-test exit code: $code"
          exit $code
      - name: Pack .app (keeps exec bits and symlinks)
        run: |
          tar -czf AppRestore-macos.tar.gz -C dist AppRestore.app
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: selftest-macos
          path: selftest-macos.json
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        with:
          name: AppRestore-macos
          path: AppRestore-macos.tar.gz
