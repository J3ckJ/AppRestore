name: GUI build

on:
  push:
    branches: [gui]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    name: Windows GUI artifact
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - uses: actions/setup-go@0a12ed9d6a96ab950c8f026ed9f722fe0da7ef32 # v5.0.2
        with:
          go-version: "1.25.0"
          cache: false
      - name: Install
        shell: pwsh
        run: |
          python -m pip install -U pip
          python -m pip install . -r requirements/gui-build.txt pytest
      - name: Test
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          python -m pytest -q tests/test_gui_icons.py tests/test_gui_adapter.py tests/test_gui_smoke.py tests/test_gui_errors.py tests/test_frozen_runtime.py tests/test_gui_updater.py tests/test_gui_update_ui.py tests/test_gui_packaging.py tests/test_auth_pty_posix.py tests/test_quick_session.py tests/test_ui4b_names_icons.py tests/test_ui4b_logic.py tests/test_ui4b_passphrase.py
      - name: Build
        shell: pwsh
        run: |
          pyinstaller packaging/apprestore-gui.spec --noconfirm --clean
      - name: Package, self-test and verify the release zip
        shell: pwsh
        run: |
          bash packaging/build-ipatool.sh windows-amd64
          if ($LASTEXITCODE -ne 0) { exit 1 }
          python packaging/package_gui.py --out gui-dist --ipatool-archive dist/ipatool/ipatool-2.6.0-windows-amd64.tar.gz
          if ($LASTEXITCODE -ne 0) { exit 1 }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: selftest-windows
          path: gui-dist/selftest-windows.json
          if-no-files-found: warn
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: AppRestore-GUI-Windows
          path: |
            gui-dist/AppRestore-GUI-Windows.zip
            gui-dist/AppRestore-GUI-Windows.zip.sha256
          if-no-files-found: error

  macos:
    name: macOS GUI artifact
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - uses: actions/setup-go@0a12ed9d6a96ab950c8f026ed9f722fe0da7ef32 # v5.0.2
        with:
          go-version: "1.25.0"
          cache: false
      - name: Install
        run: |
          python -m pip install -U pip
          python -m pip install . -r requirements/gui-build.txt pytest
      - name: Test
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          python -m pytest -q tests/test_gui_icons.py tests/test_gui_adapter.py tests/test_gui_smoke.py tests/test_gui_errors.py tests/test_frozen_runtime.py tests/test_gui_updater.py tests/test_gui_update_ui.py tests/test_gui_packaging.py tests/test_auth_pty_posix.py tests/test_quick_session.py tests/test_ui4b_names_icons.py tests/test_ui4b_logic.py tests/test_ui4b_passphrase.py
      - name: Build
        run: |
          pyinstaller packaging/apprestore-gui.spec --noconfirm --clean
      - name: Package, self-test and verify the release zip
        run: |
          set -euo pipefail
          case "$(uname -m)" in
            arm64) ipatool_asset="macos-arm64" ;;
            x86_64) ipatool_asset="macos-amd64" ;;
            *) echo "unsupported macOS architecture: $(uname -m)" >&2; exit 1 ;;
          esac
          bash packaging/build-ipatool.sh "$ipatool_asset"
          python packaging/package_gui.py --out gui-dist \
            --ipatool-archive "dist/ipatool/ipatool-2.6.0-${ipatool_asset}.tar.gz"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: selftest-macos
          path: gui-dist/selftest-macos.json
          if-no-files-found: warn
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: AppRestore-GUI-macOS
          path: |
            gui-dist/AppRestore-GUI-macOS.zip
            gui-dist/AppRestore-GUI-macOS.zip.sha256
          if-no-files-found: error
