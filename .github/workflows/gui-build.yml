name: GUI build

on:
  push:
    branches: [gui]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    name: Windows GUI artifact
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        shell: pwsh
        run: |
          python -m pip install -U pip
          python -m pip install . -r requirements/gui-build.txt pytest
      - name: Test
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          python -m pytest -q tests/test_gui_icons.py tests/test_gui_adapter.py tests/test_gui_smoke.py tests/test_frozen_runtime.py tests/test_gui_updater.py tests/test_gui_update_ui.py tests/test_gui_packaging.py tests/test_auth_pty_posix.py
      - name: Build
        shell: pwsh
        run: |
          pyinstaller packaging/apprestore-gui.spec --noconfirm --clean
      - name: Package, self-test and verify the release zip
        shell: pwsh
        run: |
          python packaging/package_gui.py --out gui-dist
          if ($LASTEXITCODE -ne 0) { exit 1 }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: selftest-windows
          path: gui-dist/selftest-windows.json
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        with:
          name: AppRestore-GUI-Windows
          path: |
            gui-dist/AppRestore-GUI-Windows.zip
            gui-dist/AppRestore-GUI-Windows.zip.sha256
          if-no-files-found: error

  macos:
    name: macOS GUI artifact
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install -U pip
          python -m pip install . -r requirements/gui-build.txt pytest
      - name: Test
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          python -m pytest -q tests/test_gui_icons.py tests/test_gui_adapter.py tests/test_gui_smoke.py tests/test_frozen_runtime.py tests/test_gui_updater.py tests/test_gui_update_ui.py tests/test_gui_packaging.py tests/test_auth_pty_posix.py
      - name: Build
        run: |
          pyinstaller packaging/apprestore-gui.spec --noconfirm --clean
      - name: Package, self-test and verify the release zip
        run: |
          python packaging/package_gui.py --out gui-dist
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: selftest-macos
          path: gui-dist/selftest-macos.json
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        with:
          name: AppRestore-GUI-macOS
          path: |
            gui-dist/AppRestore-GUI-macOS.zip
            gui-dist/AppRestore-GUI-macOS.zip.sha256
          if-no-files-found: error
