name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-tests:
    name: Windows / Python ${{ matrix.python-version }}
    runs-on: windows-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.10"
          - "3.12"

    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: utf-8

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install project and test runner
        run: |
          python -m pip install --upgrade pip
          python -m pip install --editable .
          python -m pip install pytest

      - name: Run tests
        run: python -m pytest -q

      - name: Compile Python sources
        run: python -m compileall -q apprestore.py apprestore_core scripts tests

      - name: Build and validate release assets
        if: matrix.python-version == '3.12'
        shell: pwsh
        run: |
          python scripts/build-release.py
          if ($LASTEXITCODE -ne 0) {
            throw "release build failed"
          }

          $Version = (& python apprestore.py --version).Trim()
          $ArchiveName = "AppRestore-$Version-source.zip"
          $ArchivePath = Join-Path "dist" $ArchiveName
          $BootstrapPath = Join-Path "dist" "install.ps1"
          $ChecksumsPath = Join-Path "dist" "SHA256SUMS.txt"
          foreach ($Path in @($ArchivePath, $BootstrapPath, $ChecksumsPath)) {
            if (-not (Test-Path -LiteralPath $Path -PathType Leaf)) {
              throw "missing release asset: $Path"
            }
          }

          $ExpectedUrl = (
            "https://github.com/J3ckJ/AppRestore/releases/download/" +
            "v$Version/$ArchiveName"
          )
          $Bootstrap = Get-Content -LiteralPath $BootstrapPath -Raw
          if (-not $Bootstrap.Contains($ExpectedUrl)) {
            throw "bootstrap contains an unexpected archive URL"
          }

          $ArchiveHash = (
            Get-FileHash -LiteralPath $ArchivePath -Algorithm SHA256
          ).Hash.ToLowerInvariant()
          $BootstrapHash = (
            Get-FileHash -LiteralPath $BootstrapPath -Algorithm SHA256
          ).Hash.ToLowerInvariant()
          $ExpectedChecksums = (
            "$ArchiveHash  $ArchiveName`n" +
            "$BootstrapHash  install.ps1`n"
          )
          $ActualChecksums = (
            Get-Content -LiteralPath $ChecksumsPath -Raw
          ).Replace("`r`n", "`n")
          if ($ActualChecksums -ne $ExpectedChecksums) {
            throw "SHA256SUMS.txt does not match the generated assets"
          }
