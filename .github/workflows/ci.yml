name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-tests:
    name: Windows / Python ${{ matrix.python-version }}
    runs-on: windows-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.10"
          - "3.12"
          - "3.13"

    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: utf-8

    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements/runtime.lock
            requirements/test.lock
            requirements/wheel-build.lock

      - name: Install project and test runner
        run: |
          python -m pip install --require-hashes --only-binary=:all: --no-deps -r requirements/build.lock
          python -m pip install --require-hashes --only-binary=:all: --no-deps --find-links requirements/wheels -r requirements/runtime.lock
          python -m pip install --no-deps --no-build-isolation --editable .
          python -m pip install --require-hashes --only-binary=:all: --no-deps -r requirements/test.lock

      - name: Run tests
        run: python -m pytest -q

      - name: Validate relocatable module entrypoint
        shell: pwsh
        run: |
          $Expected = (& python apprestore.py --version).Trim()
          $Actual = (& python -m apprestore_core.cli --version).Trim()
          if ($LASTEXITCODE -ne 0 -or $Actual -ne $Expected) {
            throw "python -m apprestore_core.cli version contract failed"
          }

      - name: Compile Python sources
        run: python -m compileall -q apprestore.py apprestore_core scripts tests

      - name: Build and validate release assets
        if: matrix.python-version == '3.12'
        shell: pwsh
        run: |
          python scripts/build-release.py
          if ($LASTEXITCODE -ne 0) {
            throw "release build failed"
          }

          $Version = (& python apprestore.py --version).Trim()
          $ArchiveName = "AppRestore-$Version-source.zip"
          $ArchivePath = Join-Path "dist" $ArchiveName
          $BootstrapPath = Join-Path "dist" "install.ps1"
          $MacBootstrapPath = Join-Path "dist" "install.sh"
          $ChecksumsPath = Join-Path "dist" "SHA256SUMS.txt"
          foreach ($Path in @(
            $ArchivePath,
            $BootstrapPath,
            $MacBootstrapPath,
            $ChecksumsPath
          )) {
            if (-not (Test-Path -LiteralPath $Path -PathType Leaf)) {
              throw "missing release asset: $Path"
            }
          }

          $ExpectedUrl = (
            "https://github.com/J3ckJ/AppRestore/releases/download/" +
            "v$Version/$ArchiveName"
          )
          $Bootstrap = Get-Content -LiteralPath $BootstrapPath -Raw
          if (-not $Bootstrap.Contains($ExpectedUrl)) {
            throw "bootstrap contains an unexpected archive URL"
          }
          $MacBootstrap = Get-Content -LiteralPath $MacBootstrapPath -Raw
          if (-not $MacBootstrap.Contains($ExpectedUrl)) {
            throw "macOS bootstrap contains an unexpected archive URL"
          }

          $ArchiveHash = (
            Get-FileHash -LiteralPath $ArchivePath -Algorithm SHA256
          ).Hash.ToLowerInvariant()
          $BootstrapHash = (
            Get-FileHash -LiteralPath $BootstrapPath -Algorithm SHA256
          ).Hash.ToLowerInvariant()
          $MacBootstrapHash = (
            Get-FileHash -LiteralPath $MacBootstrapPath -Algorithm SHA256
          ).Hash.ToLowerInvariant()
          $ExpectedChecksums = (
            "$ArchiveHash  $ArchiveName`n" +
            "$BootstrapHash  install.ps1`n" +
            "$MacBootstrapHash  install.sh`n"
          )
          $ActualChecksums = (
            Get-Content -LiteralPath $ChecksumsPath -Raw
          ).Replace("`r`n", "`n")
          if ($ActualChecksums -ne $ExpectedChecksums) {
            throw "SHA256SUMS.txt does not match the generated assets"
          }

  macos-tests:
    name: macOS / install contract
    runs-on: macos-latest
    timeout-minutes: 20

    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: utf-8

    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements/runtime.lock
            requirements/test.lock
            requirements/wheel-build.lock

      - name: Install project and test runner
        run: |
          python -m pip install --require-hashes --only-binary=:all: --no-deps -r requirements/build.lock
          python -m pip install --require-hashes --only-binary=:all: --no-deps --find-links requirements/wheels -r requirements/runtime.lock
          python -m pip install --no-deps --no-build-isolation --editable .
          python -m pip install --require-hashes --only-binary=:all: --no-deps -r requirements/test.lock

      - name: Validate shell syntax
        run: |
          /bin/bash -n apprestore.sh
          /bin/bash -n install-macos.sh
          /bin/bash -n scripts/install.sh.in

      - name: Run tests
        run: python -m pytest -q

      - name: Rebuild vendored wheel byte-for-byte
        run: /bin/bash scripts/verify-vendored-wheel-macos.sh

      - name: Validate relocatable module entrypoint
        run: |
          expected="$(python apprestore.py --version)"
          actual="$(python -m apprestore_core.cli --version)"
          test "$actual" = "$expected"

      - name: Compile Python sources
        run: python -m compileall -q apprestore.py apprestore_core scripts tests

      - name: Build release assets
        run: python scripts/build-release.py

      - name: Validate macOS release asset
        run: |
          version="$(python apprestore.py --version)"
          archive="dist/AppRestore-${version}-source.zip"
          test -f "$archive"
          test -f dist/install.ps1
          test -f dist/install.sh
          test -f dist/SHA256SUMS.txt
          /bin/bash -n dist/install.sh
          grep -F \
            "https://github.com/J3ckJ/AppRestore/releases/download/v${version}/AppRestore-${version}-source.zip" \
            dist/install.sh
          archive_hash="$(shasum -a 256 "$archive" | awk '{print $1}')"
          grep -F "${archive_hash}  AppRestore-${version}-source.zip" \
            dist/SHA256SUMS.txt
          mac_hash="$(shasum -a 256 dist/install.sh | awk '{print $1}')"
          grep -F "${mac_hash}  install.sh" dist/SHA256SUMS.txt
