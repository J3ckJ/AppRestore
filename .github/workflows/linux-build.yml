name: Linux build and distro checks
on:
  workflow_dispatch:
  workflow_call:
  pull_request:
    paths:
      - 'apprestore_core/**'
      - 'apprestore_gui/**'
      - 'packaging/**'
      - 'requirements/**'
      - 'pyproject.toml'
      - '.github/workflows/linux-build.yml'
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Build CLI and GUI on the oldest supported glibc
        run: docker build -f packaging/Dockerfile.linux -t apprestore-linux .
      - name: Test in the build environment
        run: docker run --rm -e QT_QPA_PLATFORM=offscreen -e QT_QUICK_CONTROLS_STYLE=Basic apprestore-linux python -m pytest -q
      - name: Copy verified archives
        run: |
          container=$(docker create apprestore-linux)
          docker cp "$container:/src/linux-dist" linux-dist
          docker rm "$container"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: apprestore-linux-x86_64
          path: |
            linux-dist/*.zip
            linux-dist/*.sha256
          if-no-files-found: error
  smoke:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        distro: ['ubuntu:22.04', 'ubuntu:24.04', 'debian:bookworm', 'fedora:latest']
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: apprestore-linux-x86_64
          path: linux-dist
      - name: Check the same binaries in a clean distribution
        run: |
          docker run --rm -v "$PWD/linux-dist:/assets:ro" \
            -v "$PWD/packaging/smoke-linux.sh:/smoke.sh:ro" \
            '${{ matrix.distro }}' bash /smoke.sh
