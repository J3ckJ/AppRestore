name: CLI build

# Manual check of the standalone CLI assets before tagging a release.
# release.yml builds the same assets for the tagged commit.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cli:
    name: CLI / ${{ matrix.label }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            label: Windows
            ipatool_asset: windows-amd64
            asset: AppRestore-CLI-Windows.zip
          - runner: macos-latest
            label: macOS Apple Silicon
            ipatool_asset: macos-arm64
            asset: AppRestore-CLI-macOS.zip
          - runner: macos-15-intel
            label: macOS Intel
            ipatool_asset: macos-amd64
            asset: AppRestore-CLI-macOS-Intel.zip
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: utf-8
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - uses: actions/setup-go@0a12ed9d6a96ab950c8f026ed9f722fe0da7ef32 # v5.0.2
        with:
          go-version: "1.26.5"
          cache: false
      - name: Install locked runtime and pinned build tools
        run: |
          set -euo pipefail
          python -m pip install --require-hashes --only-binary=:all: --no-deps -r requirements/build.lock
          python -m pip install --require-hashes --only-binary=:all: --no-deps --find-links requirements/wheels -r requirements/runtime.lock
          python -m pip install --no-deps --no-build-isolation .
          python -m pip install --only-binary=:all: -r requirements/gui-build.txt
      - name: Build patched ipatool
        run: bash packaging/build-ipatool.sh "${{ matrix.ipatool_asset }}"
      - name: Build, verify and zip the standalone CLI
        run: |
          set -euo pipefail
          pyinstaller packaging/apprestore-cli.spec --noconfirm --clean --distpath dist-cli --workpath build-cli
          python packaging/package_cli.py --dist dist-cli --out cli-dist \
            --expect-version "$(python -c 'import apprestore_core; print(apprestore_core.__version__)')" \
            --ipatool-archive "dist/ipatool/ipatool-2.8.1-${{ matrix.ipatool_asset }}.tar.gz"
          test -f "cli-dist/${{ matrix.asset }}"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ matrix.asset }}
          path: |
            cli-dist/${{ matrix.asset }}
            cli-dist/${{ matrix.asset }}.sha256
          if-no-files-found: error
