[build-system]
requires = ["setuptools>=77.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "apprestore"
version = "0.2.0"
description = "Restore offloaded iOS applications from verified IPA files on macOS and Windows."
readme = "README.md"
requires-python = ">=3.10,<3.14"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
dependencies = [
    "pymobiledevice3==10.1.0",
]

[project.scripts]
apprestore = "apprestore_core.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["apprestore_core*"]
exclude = ["tests*"]
