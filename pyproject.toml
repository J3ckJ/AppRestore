[build-system]
requires = ["setuptools>=77.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "apprestore"
version = "0.4.1"
description = "Restore offloaded iOS applications from verified IPA files on macOS and Windows."
readme = "README.md"
requires-python = ">=3.10,<3.14"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
dependencies = [
    "pymobiledevice3==10.1.0",
    # cryptography 49+ ships macOS wheels for arm64 only. Intel Macs keep the
    # newest line with a universal2 wheel so the hash-locked, binary-only
    # install (and the Intel GUI build) works without a Rust toolchain.
    "cryptography>=48.0.1,<49 ; sys_platform == 'darwin' and platform_machine == 'x86_64'",
    "cryptography>=50.0.0 ; sys_platform != 'darwin' or platform_machine != 'x86_64'",
]

[project.scripts]
apprestore = "apprestore_core.cli:main"
apprestore-gui = "apprestore_gui.app:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["apprestore_core*", "apprestore_gui*"]
exclude = ["tests*"]

[project.optional-dependencies]
gui = [
  "PySide6>=6.6,<6.10",
  "pywinpty>=2.0.0; platform_system==\"Windows\"",
]

[tool.setuptools.package-data]
apprestore_gui = ["resources/**/*", "ui4b/data/*.json", "qml/**/*.qml", "qml4b/**/*"]

[tool.pytest.ini_options]
# pymobiledevice3 currently brings in xonsh, whose third-party pytest plugin
# tries to create an interactive Windows console during collection.  AppRestore
# does not use that plugin; disabling it keeps `python -m pytest` reliable in
# GUI terminals and CI while leaving the project's own plugins available.
addopts = "-p no:xonsh"
