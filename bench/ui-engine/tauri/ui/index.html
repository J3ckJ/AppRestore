<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>AppRestore</title>
<style>
  html, body { height: 100%; margin: 0; font: 15px -apple-system, "Segoe UI", system-ui, sans-serif; }
  body { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; }
  h1 { font-size: 28px; font-weight: 600; margin: 0; }
</style>
</head>
<body>
<h1>AppRestore</h1>
<button>Find apps</button>
<script>
  const invoke = window.__TAURI__.core.invoke;
  requestAnimationFrame(() => requestAnimationFrame(async () => {
    await invoke("mark_window");
    await invoke("wait_core");
    await invoke("finish");
  }));
</script>
</body>
</html>
